<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyTimeTree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/portal/styles.css" />
</head>
<body>
  <div id="portal" class="portal">
    <header class="topbar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1 class="brand">MyTimeTree</h1>
      </div>
      <div id="account-shell" class="account-shell" hidden>
        <label class="sr-only" for="account-select">切换账户</label>
        <select id="account-select"></select>
      </div>
    </header>

    <section id="onboarding" class="panel onboarding" hidden>
      <p class="lede">为孩子开立第一棵时间树</p>
      <form id="onboarding-form" class="stack">
        <label>孩子昵称<input name="name" required maxlength="32" placeholder="例如：小明" /></label>
        <label>家长密码<input name="password" type="password" required minlength="4" /></label>
        <label>资产日利率<input name="asset_interest_rate" type="number" step="0.001" min="0" value="0.01" /></label>
        <button type="submit" class="btn primary">开始种植</button>
      </form>
      <p id="onboarding-error" class="error" hidden></p>
    </section>

    <main id="main" class="main" hidden>
      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="home" role="tab">主屏</button>
        <button type="button" class="tab" data-tab="habits" role="tab">
          习惯<span id="habit-badge" class="tab-badge" hidden>0</span>
        </button>
        <button type="button" class="tab" data-tab="ledger" role="tab">流水</button>
        <button type="button" class="tab" data-tab="settings" role="tab">设置</button>
        <button type="button" class="tab" data-tab="analytics" role="tab">分析</button>
      </nav>

      <section id="tab-home" class="tab-panel active" role="tabpanel">
        <p class="tagline">时间也能存进树里</p>
        <div class="hero-tree" id="tree-stage" data-stage="seed">
          <div class="tree-visual" aria-hidden="true"></div>
          <p class="stage-label" id="stage-label">种子</p>
          <p class="ornaments" id="ornaments-line"></p>
        </div>
        <div class="balances">
          <div>
            <span class="muted">资产</span>
            <strong id="asset-min">0</strong><span class="unit">分</span>
          </div>
          <div>
            <span class="muted">负债</span>
            <strong id="liab-min">0</strong><span class="unit">分</span>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="btn-spend">支出</button>
          <button type="button" class="btn" id="btn-borrow">借用</button>
          <button type="button" class="btn" id="btn-repay">还入</button>
        </div>
        <p id="home-msg" class="msg" hidden></p>
      </section>

      <section id="tab-habits" class="tab-panel" role="tabpanel" hidden>
        <p class="tagline">记下好习惯，换来可存时间</p>
        <div id="habit-celeb" class="habit-celeb" hidden></div>
        <div id="parent-guide" class="parent-guide" hidden>
          <p id="parent-script-text" class="parent-script"></p>
          <div id="offline-hint-card" class="offline-hint">
            <strong id="offline-hint-title"></strong>
            <p id="offline-hint-body"></p>
            <p id="offline-hint-image" class="muted"></p>
          </div>
        </div>
        <ul id="habit-today-list" class="habit-list"></ul>
        <button type="button" class="btn compact" id="btn-habit-snooze">稍后提醒</button>
        <div class="habit-actions">
          <button type="button" class="btn" id="btn-habit-board">好习惯总表</button>
          <button type="button" class="btn" id="btn-habit-redeem-all">兑换待入账</button>
        </div>
        <div class="habit-actions">
          <button type="button" class="btn" id="btn-habit-timeline">时间线</button>
          <button type="button" class="btn" id="btn-habit-rules">兑换规则</button>
        </div>
        <div id="habit-board" class="habit-board" hidden>
          <h2>今日总表</h2>
          <p id="habit-board-stats" class="muted"></p>
          <ul id="habit-board-list" class="habit-list"></ul>
        </div>
        <div id="habit-timeline" class="habit-board" hidden>
          <h2>时间线</h2>
          <ul id="habit-timeline-list" class="habit-list"></ul>
          <h2>分类</h2>
          <ul id="habit-category-list" class="habit-list"></ul>
        </div>
        <div id="habit-rules" class="habit-board" hidden>
          <h2>兑换规则</h2>
          <ul id="habit-rules-list" class="habit-list"></ul>
        </div>
        <p id="habit-msg" class="msg" hidden></p>
      </section>

      <section id="tab-ledger" class="tab-panel" role="tabpanel" hidden>
        <ul id="ledger-list" class="ledger-list"></ul>
        <p id="ledger-empty" class="muted" hidden>暂无流水</p>
      </section>

      <section id="tab-settings" class="tab-panel" role="tabpanel" hidden>
        <form id="settings-form" class="stack">
          <label>每日派发（分）<input name="daily_grant_minutes" type="number" min="0" /></label>
          <label>默认支出（分）<input name="default_spend_minutes" type="number" min="1" /></label>
          <label>默认还入（分）<input name="default_repay_minutes" type="number" min="1" /></label>
          <button type="submit" class="btn primary">保存设置</button>
        </form>
        <p id="settings-msg" class="msg" hidden></p>
      </section>

      <section id="tab-analytics" class="tab-panel" role="tabpanel" hidden>
        <div class="analytics-block">
          <h2>本周</h2>
          <pre id="analytics-week" class="brief"></pre>
        </div>
        <div class="analytics-block">
          <h2>本月</h2>
          <pre id="analytics-month" class="brief"></pre>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/portal/app.js"></script>
</body>
</html>
